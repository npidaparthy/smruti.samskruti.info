# BG chapter Q&A PDF — renders data/quiz/bg/chNN/*.json (against
# data/bg/content/chapters/chNN.json) into qa/pdf/bg-chNN-te.pdf, using the
# generator in scripts/qa-pdf/. Runs automatically for whichever chapters
# changed on push, or on demand for a chosen set via workflow_dispatch.
name: BG Q&A PDF

on:
  push:
    branches: [main]
    paths:
      - "data/quiz/bg/**"
      - "data/bg/content/chapters/**"
  workflow_dispatch:
    inputs:
      chapters:
        description: "Chapters to (re)generate: '1' | '1,2' | 'all'. Blank on a push run auto-detects from the diff."
        required: false
        type: string
        default: "all"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Indic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core fonts-noto-ui-core fonts-lohit-telu
          sudo fc-cache -f

      - name: Install generator dependencies
        working-directory: scripts/qa-pdf
        run: npm ci --no-audit --no-fund

      - name: Determine chapters to build
        id: chapters
        env:
          INPUT_CHAPTERS: ${{ inputs.chapters }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_CHAPTERS" ] && [ "$INPUT_CHAPTERS" != "all" ]; then
            # explicit list, e.g. "1" or "1,2"
            LIST="$INPUT_CHAPTERS"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # "all" (or blank, which defaults to "all" via the input default) — every chapter with a quiz dir
            LIST=$(ls data/quiz/bg | grep -oE '[0-9]+' | sed 's/^0*//' | sort -un | paste -sd, -)
          else
            # push — only the chapter(s) touched by this push's diff
            LIST=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" -- data/quiz/bg/ data/bg/content/chapters/ \
                   | grep -oE 'ch[0-9]+' | grep -oE '[0-9]+' | sed 's/^0*//' | sort -un | paste -sd, -)
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Chapters to build: $LIST"

      - name: Generate PDFs
        if: steps.chapters.outputs.list != ''
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHAPTER_LIST: ${{ steps.chapters.outputs.list }}
        run: |
          IFS=',' read -ra CHS <<< "$CHAPTER_LIST"
          for ch in "${CHS[@]}"; do
            [ -z "$ch" ] && continue
            chTag=$(printf "ch%02d" "$ch")
            if [ ! -d "data/quiz/bg/$chTag" ]; then
              echo "Skipping chapter $ch — no quiz data yet (data/quiz/bg/$chTag/ missing)"
              continue
            fi
            echo "::group::Chapter $ch"
            node scripts/qa-pdf/gen-qa-pdf.mjs --chapter "$ch" --chrome "$CHROME_PATH"
            echo "::endgroup::"
          done

      - name: Commit generated PDFs
        if: steps.chapters.outputs.list != ''
        run: |
          git config user.name  "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add qa/pdf/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "qa: regenerate chapter Q&A PDF(s) [${{ steps.chapters.outputs.list }}]"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            echo "push rejected; rebasing onto origin/${{ github.ref_name }} — attempt $i"
            git fetch origin "${{ github.ref_name }}" || exit 1
            git rebase -X theirs "origin/${{ github.ref_name }}" || { git rebase --abort; exit 1; }
          done
          echo "failed to push after retries"; exit 1
