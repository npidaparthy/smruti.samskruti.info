# Daily verse card — caller workflow (lives in the smruti site repo).
# Calls the central reusable generator in samskruti-archives, which renders each
# feed's card, commits daily/<feed>/today.* back here, and archives dated copies.
# No deploy_workflow: this site uses GitHub Pages "deploy from branch (main)",
# so the daily commit auto-publishes.
name: Daily verse card

on:
  schedule:
    # Primary + staggered backups, all targeting 9:00 AM IST or later.
    # GitHub Actions delays scheduled runs under load (sometimes hours) and
    # drops them rather than queuing if too late, so one exact-time cron
    # isn't reliable. The hour gate in daily-tool now accepts any run at or
    # after the target hour, and skips per-feed if already generated today —
    # so these backups are safe: whichever lands first wins, the rest no-op.
    - cron: "08 04 * * *"   # primary: ~9:38 AM IST
    - cron: "08 06 * * *"   # backup 1: ~11:38 AM IST
    - cron: "08 09 * * *"   # backup 2: ~2:38 PM IST
  workflow_dispatch:       # manual "run now" — bypasses the hour gate
    inputs:
      feeds:
        description: "Feed to run (all = every feed)."
        required: false
        type: choice
        default: "all"
        options:
          - all
          - bg
          - vsn
          - sl
      script:
        description: "Verse script override (te=Telugu, sa=Devanagari, iast=Roman). Blank = each feed's default."
        required: false
        type: choice
        default: ""
        options:
          - ""
          - te
          - sa
          - iast
      telegram:
        description: "Telegram mode"
        required: false
        type: choice
        default: "live"
        options:
          - live
          - test
          - none

permissions:
  contents: write
  actions: write   # required: the reusable workflow declares actions:write (used only when deploy_workflow is set)

jobs:
  daily:
    uses: npidaparthy/samskruti-archives/.github/workflows/daily-reusable.yml@main
    with:
      config: daily/config.json
      force: ${{ github.event_name == 'workflow_dispatch' }}
      feeds: ${{ inputs.feeds != 'all' && inputs.feeds || '' }}
      script: ${{ inputs.script }}
      telegram_mode: ${{ inputs.telegram || 'live' }}
    secrets:
      ARCHIVE_TOKEN:  ${{ secrets.ARCHIVE_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
